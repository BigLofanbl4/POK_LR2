name: Laboratory 2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: tested-build
          path: dist/
          if-no-files-found: error

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v4
        with:
          name: tested-build
          path: dist/
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: pok-lab02-1.0.0.tgz
          if-no-files-found: error
